<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InReal // System Neural Canvas & Architecture Map</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-amber-warmth: radial-gradient(circle at 15% 15%, rgba(251, 191, 36, 0.16) 0%, transparent 45%),
                         radial-gradient(circle at 85% 20%, rgba(249, 115, 22, 0.12) 0%, transparent 40%),
                         radial-gradient(circle at 50% 80%, rgba(13, 148, 136, 0.10) 0%, transparent 55%),
                         #FAF8F2;
      --grid-dot: radial-gradient(circle, #CBD5E1 1.2px, transparent 1.2px);
    }

    * {
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-amber-warmth);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0F172A;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Infinite Canvas Dot Grid */
    #viewport {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      cursor: grab;
      background-size: 28px 28px;
      background-image: var(--grid-dot);
    }

    #viewport.grabbing {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG Link Canvas */
    #edge-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Glass Panels */
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 32px -10px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .node {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      border-radius: 20px;
    }

    .node:hover {
      box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.25), 0 6px 14px -2px rgba(15, 23, 42, 0.08);
      border-color: #FBBF24;
      transform: translateY(-2px);
    }

    .node.active {
      border-color: #F59E0B !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 25px 50px -10px rgba(245, 158, 11, 0.35) !important;
      background: #FFFFFF !important;
      z-index: 30;
    }

    /* Animated Circuit Link Lines */
    .wire-glow {
      stroke: #CBD5E1;
      stroke-width: 2.5;
      fill: none;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .wire-glow.active-wire {
      stroke: #F59E0B;
      stroke-width: 3.5;
      stroke-dasharray: 8;
      animation: circuitFlow 1.2s linear infinite;
    }

    @keyframes circuitFlow {
      to {
        stroke-dashoffset: -32;
      }
    }

    /* Pulse Particle on wire */
    .particle {
      fill: #F59E0B;
      filter: drop-shadow(0 0 6px #F59E0B);
    }

    /* Floating UI HUD elements */
    .hud {
      position: absolute;
      z-index: 100;
      pointer-events: auto;
    }

    /* Subtle entry animation */
    .fade-pop {
      animation: fadePop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadePop {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Top Floating HUD Bar -->
  <header class="hud top-5 left-6 right-6 flex items-center justify-between pointer-events-none">
    <div class="glass-card px-5 py-3 rounded-2xl flex items-center space-x-4 pointer-events-auto shadow-lg">
      <a href="/" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center text-slate-900 font-bold shadow-md shadow-amber-400/30 hover:scale-105 transition-transform">
        <i class="ph-bold ph-radar text-2xl"></i>
      </a>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-base font-extrabold tracking-tight text-slate-900">InReal</h1>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800 border border-amber-200">NEURAL MAP</span>
        </div>
        <p class="text-xs text-slate-500 font-medium">Interactive Canvas & Architecture Flowchart</p>
      </div>
    </div>

    <!-- Map Controls & Shortcuts -->
    <div class="glass-card px-4 py-2.5 rounded-2xl flex items-center space-x-2 pointer-events-auto shadow-lg">
      <button onclick="zoomBy(1.2)" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 transition-colors" title="Zoom In (+)">
        <i class="ph-bold ph-magnifying-glass-plus text-lg"></i>
      </button>
      <button onclick="zoomBy(0.8)" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 transition-colors" title="Zoom Out (-)">
        <i class="ph-bold ph-magnifying-glass-minus text-lg"></i>
      </button>
      <button onclick="fitView()" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 transition-colors" title="Fit to Screen (F)">
        <i class="ph-bold ph-arrows-out text-lg"></i>
      </button>
      <div class="w-[1px] h-6 bg-slate-200 mx-1"></div>
      <button onclick="resetAllNodes()" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition-all flex items-center space-x-1.5">
        <i class="ph ph-arrows-clockwise font-bold"></i>
        <span>Collapse All</span>
      </button>
      <a href="/" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition-all flex items-center space-x-1.5">
        <i class="ph ph-arrow-left font-bold"></i>
        <span>Radar Dashboard</span>
      </a>
    </div>
  </header>

  <!-- Bottom Floating Minimap / Legend HUD -->
  <div class="hud bottom-6 left-6 glass-card px-5 py-3 rounded-2xl shadow-lg flex items-center space-x-6">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 absolute"></span>
      <span class="text-xs font-bold text-slate-800 ml-1">Live Pipeline Mode</span>
    </div>
    <div class="flex items-center space-x-4 text-[11px] text-slate-500 font-medium">
      <span class="flex items-center space-x-1"><i class="ph-fill ph-hand-grabbing text-slate-400"></i><span>Drag canvas to Pan</span></span>
      <span class="flex items-center space-x-1"><i class="ph-fill ph-mouse-simple text-slate-400"></i><span>Scroll to Zoom</span></span>
      <span class="flex items-center space-x-1"><i class="ph-fill ph-cursor-click text-amber-500"></i><span>Click node to expand</span></span>
    </div>
  </div>

  <!-- Interactive World Viewport -->
  <div id="viewport">
    <div id="world">
      <!-- Dynamic SVG Connections -->
      <svg id="edge-svg" width="5000" height="3000">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
          </marker>
        </defs>
        <!-- Lines injected dynamically -->
      </svg>

      <!-- Nodes rendered dynamically into world -->
      <div id="nodes-layer"></div>
    </div>
  </div>

  <script>
    // --- Architecture Nodes & Dynamic Subnodes Data ---
    const primaryNodes = [
      {
        id: "stage-1",
        tier: "STAGE 01",
        category: "DATA HARVESTING",
        title: "Target Scrapers",
        icon: "ph-globe",
        desc: "Parallel Chromium bots collecting live AI opportunities.",
        badgeColor: "bg-amber-100 text-amber-800 border-amber-200",
        x: 140,
        y: 420,
        subnodes: [
          { id: "s1-1", title: "Internshala & Unstop", desc: "Headless Playwright bots parsing stipend, deadlines & apply URLs.", tag: "DOM Scraper", icon: "ph-building-office", dx: -90, dy: -260 },
          { id: "s1-2", title: "Naukri & Foundit", desc: "Anti-bot stealth bypass with human delay intervals.", tag: "Stealth Bot", icon: "ph-briefcase", dx: 160, dy: -260 },
          { id: "s1-3", title: "BigTech Portals", desc: "Microsoft, Google, NVIDIA, Meta research career adapters.", tag: "API & REST", icon: "ph-sparkle", dx: -90, dy: 270 },
          { id: "s1-4", title: "RAM Concurrency Guard", desc: "Limits parallel Chromium workers to 2 to eliminate CPU spikes.", tag: "Resource Guard", icon: "ph-cpu", dx: 160, dy: 270 },
        ]
      },
      {
        id: "stage-2",
        tier: "STAGE 02",
        category: "INGESTION & CLEAN",
        title: "Memoryless Pipeline",
        icon: "ph-flow-arrow",
        desc: "Wipes stale history; normalizes & prepares fresh listings.",
        badgeColor: "bg-orange-100 text-orange-800 border-orange-200",
        x: 740,
        y: 420,
        subnodes: [
          { id: "s2-1", title: "Wipe Prior Run Cache", desc: "CSV and log states wiped on every run; 100% fresh execution.", tag: "Zero-Memory", icon: "ph-trash", dx: -90, dy: -260 },
          { id: "s2-2", title: "Deduplication Engine", desc: "Combines multiple postings by same employer into single post.", tag: "Normalizer", icon: "ph-funnel", dx: 160, dy: -260 },
          { id: "s2-3", title: "Signal Rules Pre-Check", desc: "Pre-evaluates UPI strings, Telegram tasks, and uncredited courses.", tag: "Rules Filter", icon: "ph-shield-warning", dx: -90, dy: 270 },
          { id: "s2-4", title: "Webhook Dispatcher", desc: "Fires HTTP POST to n8n webhook asynchronously after each source.", tag: "Fast Trigger", icon: "ph-bell-ringing", dx: 160, dy: 270 },
        ]
      },
      {
        id: "stage-3",
        tier: "STAGE 03",
        category: "AI SCAM DETECTION",
        title: "n8n Moderation Pipeline",
        icon: "ph-shield-check",
        desc: "3-tier AI pipeline checking links, vectors & GPT-4o judge.",
        badgeColor: "bg-teal-100 text-teal-800 border-teal-200",
        x: 1340,
        y: 420,
        subnodes: [
          { id: "s3-1", title: "Resolve Apply Links", desc: "Follows redirect hops, spots shorteners & marks dead/404 links.", tag: "HTTP Prober", icon: "ph-link", dx: -90, dy: -260 },
          { id: "s3-2", title: "Vector Embeddings", desc: "Azure text-embedding-3-small compares with 50+ scam patterns.", tag: "Cosine Match", icon: "ph-chart-polar", dx: 160, dy: -260 },
          { id: "s3-3", title: "GPT-4o Strict Judge", desc: "Examines post text, mandates exact quotes and probabilities.", tag: "LLM Judge", icon: "ph-brain", dx: -90, dy: 270 },
          { id: "s3-4", title: "Evidence Fusion & Sync", desc: "Combines signals + AI into verdicts, synced to /api/moderation/verdict.", tag: "Sync Engine", icon: "ph-check-circle", dx: 160, dy: 270 },
        ]
      },
      {
        id: "stage-4",
        tier: "STAGE 04",
        category: "USER DASHBOARD",
        title: "Frontend & Auth Gate",
        icon: "ph-user-circle-gear",
        desc: "SQLite session authentication and gated live radar cards.",
        badgeColor: "bg-blue-100 text-blue-800 border-blue-200",
        x: 1940,
        y: 420,
        subnodes: [
          { id: "s4-1", title: "SQLite User Auth", desc: "Hashed user credentials stored in auth.db with persistent cookies.", tag: "Session Auth", icon: "ph-database", dx: -90, dy: -260 },
          { id: "s4-2", title: "First-Item Preview Gate", desc: "1 opportunity unlocked for guests; remaining cards blurred.", tag: "Content Gating", icon: "ph-lock-key", dx: 160, dy: -260 },
          { id: "s4-3", title: "Experience Segmenting", desc: "Saves experience level (0 Exp, 1-2 Yrs, 3+ Yrs) in user profile.", tag: "Preferences", icon: "ph-graduation-cap", dx: -90, dy: 270 },
          { id: "s4-4", title: "Live Real-Time Radar", desc: "Reactive cards showing Verified badges, drawer facts and status.", tag: "app_radar.js", icon: "ph-browsers", dx: 160, dy: 270 },
        ]
      }
    ];

    // --- Canvas Zoom & Pan Engine ---
    let panX = 60;
    let panY = 50;
    let scale = 0.78;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let activeNodeId = null;

    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const nodesLayer = document.getElementById('nodes-layer');
    const edgeSvg = document.getElementById('edge-svg');

    function updateTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      viewport.style.backgroundPosition = `${panX}px ${panY}px`;
      viewport.style.backgroundSize = `${28 * scale}px ${28 * scale}px`;
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node')) return;
      isPanning = true;
      viewport.classList.add('grabbing');
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.remove('grabbing');
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const mouseX = e.clientX - panX;
      const mouseY = e.clientY - panY;

      const newScale = Math.min(Math.max(0.35, scale * zoomFactor), 2.2);
      panX -= mouseX * (newScale / scale - 1);
      panY -= mouseY * (newScale / scale - 1);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    function zoomBy(factor) {
      const cx = window.innerWidth / 2 - panX;
      const cy = window.innerHeight / 2 - panY;
      const newScale = Math.min(Math.max(0.35, scale * factor), 2.2);
      panX -= cx * (newScale / scale - 1);
      panY -= cy * (newScale / scale - 1);
      scale = newScale;
      updateTransform();
    }

    function fitView() {
      panX = 60;
      panY = 60;
      scale = 0.75;
      updateTransform();
    }

    // --- Render Architecture Nodes ---
    function render() {
      nodesLayer.innerHTML = '';
      edgeSvg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
          </marker>
        </defs>
      `;

      // 1. Draw Primary Connectors between Stage 1 -> 2 -> 3 -> 4
      for (let i = 0; i < primaryNodes.length - 1; i++) {
        const from = primaryNodes[i];
        const to = primaryNodes[i + 1];
        const fromX = from.x + 300;
        const fromY = from.y + 85;
        const toX = to.x;
        const toY = to.y + 85;
        const midX = (fromX + toX) / 2;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${fromX} ${fromY} C ${midX} ${fromY}, ${midX} ${toY}, ${toX} ${toY}`);
        path.setAttribute('class', `wire-glow ${activeNodeId === from.id || activeNodeId === to.id ? 'active-wire' : ''}`);
        edgeSvg.appendChild(path);
      }

      // 2. Render Primary Nodes & Subnodes
      primaryNodes.forEach(node => {
        const isActive = activeNodeId === node.id;

        // Create Main Node Card
        const el = document.createElement('div');
        el.className = `node glass-card p-6 w-[300px] border-2 ${isActive ? 'active' : 'border-slate-200/90'}`;
        el.style.left = `${node.x}px`;
        el.style.top = `${node.y}px`;

        el.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 border border-amber-200/90 flex items-center justify-center text-2xl shadow-sm">
              <i class="ph-bold ${node.icon}"></i>
            </div>
            <div class="flex flex-col items-end">
              <span class="text-[10px] font-mono px-2 py-0.5 rounded-md font-bold ${node.badgeColor} border">${node.tier}</span>
              <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mt-1">${node.category}</span>
            </div>
          </div>
          <h3 class="text-base font-extrabold text-slate-900 mb-1 flex items-center justify-between">
            <span>${node.title}</span>
            <i class="ph-bold ${isActive ? 'ph-minus-circle text-amber-500' : 'ph-plus-circle text-slate-400'} text-lg"></i>
          </h3>
          <p class="text-xs text-slate-500 leading-relaxed">${node.desc}</p>
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-bold ${isActive ? 'text-amber-600' : 'text-slate-400'}">
            <span>${isActive ? 'Active Drilldown' : 'Click to Expand 4 Modules'}</span>
            <i class="ph-bold ph-caret-right transition-transform ${isActive ? 'rotate-90' : ''}"></i>
          </div>
        `;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleNode(node.id);
        });

        nodesLayer.appendChild(el);

        // 3. Render Expanded Sub-nodes if active
        if (isActive) {
          node.subnodes.forEach((sub, idx) => {
            const subX = node.x + sub.dx;
            const subY = node.y + sub.dy;

            // Connecting wire from main node to sub-node
            const startX = node.x + 150;
            const startY = node.y + (sub.dy < 0 ? 0 : 170);
            const endX = subX + 120;
            const endY = subY + (sub.dy < 0 ? 120 : 0);
            const ctrlY = (startY + endY) / 2;

            const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            wire.setAttribute('d', `M ${startX} ${startY} C ${startX} ${ctrlY}, ${endX} ${ctrlY}, ${endX} ${endY}`);
            wire.setAttribute('class', 'wire-glow active-wire');
            edgeSvg.appendChild(wire);

            // Subnode Card DOM
            const subEl = document.createElement('div');
            subEl.className = 'node glass-card p-4 w-[240px] rounded-2xl border border-amber-300 shadow-xl fade-pop bg-white/95';
            subEl.style.left = `${subX}px`;
            subEl.style.top = `${subY}px`;
            subEl.style.animationDelay = `${idx * 60}ms`;

            subEl.innerHTML = `
              <div class="flex items-center justify-between mb-2">
                <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center text-lg">
                  <i class="ph-bold ${sub.icon}"></i>
                </div>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded font-bold bg-slate-100 text-slate-700 border border-slate-200">${sub.tag}</span>
              </div>
              <h4 class="text-xs font-bold text-slate-900 mb-1">${sub.title}</h4>
              <p class="text-[11px] text-slate-500 leading-snug">${sub.desc}</p>
            `;

            nodesLayer.appendChild(subEl);
          });
        }
      });
    }

    function toggleNode(id) {
      if (activeNodeId === id) {
        activeNodeId = null;
      } else {
        activeNodeId = id;
      }
      render();
    }

    function resetAllNodes() {
      activeNodeId = null;
      render();
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=') zoomBy(1.2);
      if (e.key === '-' || e.key === '_') zoomBy(0.8);
      if (e.key === 'f' || e.key === 'F') fitView();
      if (e.key === 'Escape') resetAllNodes();
    });

    // Initial Start
    updateTransform();
    render();
  </script>
</body>
</html>
